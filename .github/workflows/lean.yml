name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          auto-config: false
      - name: Check proof sources and theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomAudit.lean | tee axiom-audit.txt
          python3 scripts/audit.py --axiom-log axiom-audit.txt
